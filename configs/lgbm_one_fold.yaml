data:
  input_path: data/raw/eth_1h.parquet
  asset: ETH
  timeframe: 1h
  max_rows: 7500
  timestamp_unit: null
  strict_time_grid: false

validation:
  ohlc_consistency: warn

features:
  implementation: pandas_v1

label:
  horizon_hours: 6
  positive_rate: 0.20

split:
  train_days: 240
  validation_days: 7
  test_days: 30
  max_folds: 1

training:
  num_threads: 1
  num_boost_round: 2000
  early_stopping_rounds: 100
  decision_threshold: 0.5
  parameters:
    learning_rate: 0.03
    num_leaves: 31
    min_data_in_leaf: 40
    feature_fraction: 1.0
    bagging_fraction: 1.0
    bagging_freq: 0
    lambda_l1: 0.0
    lambda_l2: 0.0

output:
  root: reports/raw

run:
  seed: 42
