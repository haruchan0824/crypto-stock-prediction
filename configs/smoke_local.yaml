pipeline:
  stage: prepare

data:
  input_path: data/raw/eth_1h.parquet
  asset: ETH
  timeframe: 1h
  max_rows: 7500
  timestamp_unit: null
  strict_time_grid: false

validation:
  ohlc_consistency: warn

features:
  implementation: pandas_v1

label:
  horizon_hours: 6
  positive_rate: 0.20

split:
  train_days: 240
  validation_days: 7
  test_days: 30
  max_folds: 1

output:
  root: reports/raw

run:
  seed: 42
